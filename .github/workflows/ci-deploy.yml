name: ci-deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package.json
      - run: npm install --prefix worker
      - run: npm test
      - run: npm run lint
      - run: npm --prefix worker run deploy:dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache-dependency-path: worker/package.json
      - run: npm install --prefix worker
      - name: Apply D1 migrations when configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if node scripts/check-d1-binding.js; then npm run migrate:remote; else echo 'D1 is not configured; skipping migrations.'; fi
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:worker
      - name: Ensure Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-pages-project.js
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:pages
      - name: Smoke test API
        run: node -e "fetch('https://api.steamcommunity.monster/health').then(async r => { if (!r.ok) throw new Error('health ' + r.status); console.log(await r.text()) })"
      - name: Report production DNS status
        run: node -e "require('node:dns').promises.lookup('steamcommunity.monster').then(({address})=>console.log('production_dns='+address)).catch(()=>console.log('Production DNS missing. Fix: CNAME @ -> steamcommunity-monster.pages.dev (proxied)'))"
      - name: Report production HTTPS status
        run: node -e "fetch('https://steamcommunity.monster/').then(async r => { console.log('production_site_http=' + r.status); console.log((await r.text()).slice(0, 120)) }).catch(error => console.log('Production HTTPS check failed - ' + error.message))"
